[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ttrs"
version = "0.4.0"
description = "Keyboard-first terminal desk for the MTR ticketing API"
requires-python = ">=3.12"
dependencies = ["textual>=8.2,<9", "httpx>=0.28,<0.29", "pypinyin>=0.55,<0.56", "gmssl>=3.2.2,<4", "psutil>=7,<9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[project.scripts]
ttrs = "ttrs.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ttrs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
