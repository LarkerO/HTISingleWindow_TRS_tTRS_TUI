# 密钥通过 TICKETING_API_KEY 或连接窗口输入，不写入配置文件。
base_url = "http://127.0.0.1:8000"
agency_code = ""
ascii = false
timeout = 20.0

# 以 --keys 诊断页实际收到的键名为准。
[keys]
menu = "f10"
search = "f12"
select_row = "f9"
issue = "alt+n"
cancel_row = "alt+e"
ticket = "ctrl+g"
connect = "ctrl+o"
roundtrip = "ctrl+y"
connection = "ctrl+l"
edit_row = "alt+m"
